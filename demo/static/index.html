<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2713%27 height=%2713%27 rx=%272%27 fill=%27%23F6F3EC%27 stroke=%27%232A2925%27/%3E%3Cpath d=%27M4 6h8M4 10h5%27 stroke=%27%236A90B8%27 stroke-dasharray=%272 1.5%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top"></header>
<main>
  <nav id="rail"></nav>
  <section id="canvas"></section>
  <aside id="panel">
    <div id="tabs"></div>
    <div id="panel-body"></div>
    <div id="panel-foot"></div>
    <div id="ask">
      <div id="ask-status"></div>
      <div id="ask-rule" class="meta"></div>
      <form id="ask-form" autocomplete="off">
        <input id="ask-input" maxlength="500" aria-label="Ask Strata" placeholder="Ask Strata about this heading…">
        <button type="submit" aria-label="Send">↵</button>
      </form>
    </div>
  </aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
