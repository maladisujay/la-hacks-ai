<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Shantell+Sans:wght@400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top"></header>
<main>
  <nav id="rail"></nav>
  <section id="canvas"></section>
  <aside id="panel">
    <div id="tabs"></div>
    <div id="panel-body"></div>
    <div id="ask">
      <div id="ask-status"></div>
      <div id="ask-rule" class="meta"></div>
      <form id="ask-form" autocomplete="off">
        <input id="ask-input" placeholder="Ask Strata about this heading…">
        <button type="submit" aria-label="Send">↵</button>
      </form>
    </div>
  </aside>
</main>
<div id="overlay"></div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
